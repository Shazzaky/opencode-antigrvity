name: Windows ACP compatibility

on:
  pull_request:
  push:
    branches: [main, fix/windows-acp-compatibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Review/profile checks need no Google account and never run inference.
      - name: Download the reviewed official Windows pair
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'agy-acp-1.3.0'
          $archive = Join-Path $env:RUNNER_TEMP 'agy-acp-1.3.0.zip'
          Invoke-WebRequest 'https://dl.google.com/agy-extensions/releases/windows/agy-acp-server-1.3.0-windows-x86_64.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          "AGY_TEST_WINDOWS_ACP_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun test test/windows-support.test.ts --timeout 30000
